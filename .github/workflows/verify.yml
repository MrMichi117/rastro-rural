name: Verificar aplicación
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: rastro_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean verify
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/rastro_test?allowPublicKeyRetrieval=true&sslMode=DISABLED&connectionTimeZone=-05:00&forceConnectionTimeZoneToSession=true
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-test-only
      - uses: actions/upload-artifact@v4
        with:
          name: rastro-rural-war
          path: target/rastro-rural.war
